<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الأرقام – الصف الثالث</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--bg:#EEF6F4;--card:#fff;--ink:#17313B;--mut:#5B7480;--teal:#0E6B73;--sun:#FFC83D;--coral:#E8553F;--ok:#1E9E5A;--line:#CFE0DE;--soft:#E3F1EF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E22;--card:#172B30;--ink:#E7F1F0;--mut:#9DB5B8;--teal:#4FC3CC;--line:#2A464C;--soft:#1F3A40;--ok:#4CD08A;--coral:#FF7A63}}
:root[data-theme="dark"]{--bg:#0F1E22;--card:#172B30;--ink:#E7F1F0;--mut:#9DB5B8;--teal:#4FC3CC;--line:#2A464C;--soft:#1F3A40;--ok:#4CD08A;--coral:#FF7A63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;font-size:19px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:lining-nums;white-space:nowrap}
#bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:2px solid var(--line);font-size:19px}
.dot.cur{border-color:var(--teal);background:var(--sun)}
.dot.ok{background:var(--teal);border-color:var(--teal)}
.score{margin-inline-start:auto;background:var(--sun);color:#17313B;padding:2px 14px;border-radius:99px;font-weight:800}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px}
.meta{color:var(--mut);font-size:16px;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.q{font-weight:800;font-size:22px;line-height:1.8;margin-bottom:10px}
.vis{background:var(--soft);border-radius:12px;padding:12px;margin:10px 0;overflow-x:auto;text-align:center}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;direction:ltr}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;color:inherit;display:flex;align-items:center;gap:10px;direction:ltr;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:focus-visible,.btn:focus-visible,.in:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.opt>span{flex:1;unicode-bidi:plaintext;text-align:left}
.opt .L{flex:none;width:32px;height:32px;border-radius:8px;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:Georgia,serif}
.opt.sel{border-color:var(--teal);background:var(--soft)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--coral);opacity:.6}
.fill{margin:12px 0;font-weight:700}
.fill>div{margin:8px 0}
.eq{direction:ltr;unicode-bidi:isolate;text-align:center;font-size:24px;font-weight:800}
.in{font:inherit;direction:ltr;text-align:center;width:6em;max-width:34vw;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--card);color:var(--ink);padding:2px 6px;margin:0 4px}
.select.in,select.in{appearance:auto;padding:4px 8px;cursor:pointer;width:auto;min-width:7em}
.in.good{border-color:var(--ok)}
.in.bad{border-color:var(--coral)}
.fb{min-height:30px;margin:12px 0 4px;font-weight:700}
.fb.g{color:var(--ok)}.fb.b{color:var(--coral)}
.why{background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px;font-weight:400;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 24px;background:var(--teal);color:#fff;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#0F1E22}
.btn.alt{background:var(--sun);color:#17313B!important}
.btn[hidden]{display:none}
.vert{display:inline-flex;flex-direction:column;align-items:flex-end;direction:ltr;font-size:26px;font-weight:800}
.vert span:last-child{border-top:3px solid var(--ink);padding-top:2px}
table.t{margin:0 auto;border-collapse:collapse;min-width:260px}
.t th,.t td{border:2px solid var(--line);padding:6px 16px}
.t th{background:var(--teal);color:#fff}
.blocks{display:flex;flex-direction:column;gap:10px;align-items:center;direction:ltr}
.br{display:flex;gap:14px;align-items:flex-end}
.bg{display:flex;gap:4px;align-items:flex-end}
.h,.tn,.on{background-color:#8CC63F;background-image:linear-gradient(#0003 1px,transparent 1px),linear-gradient(90deg,#0003 1px,transparent 1px);border:1.5px solid #4E8A1B}
.h{width:42px;height:42px;background-size:4.2px 4.2px}
.tn{width:6px;height:42px;background-size:6px 4.2px}
.on{width:7px;height:7px;background-size:7px 7px}
.vcol{display:inline-flex;flex-direction:column;direction:ltr;font-size:28px;font-weight:800;gap:4px;min-width:200px}
.vr{display:flex;justify-content:space-between;gap:20px;direction:ltr}
.vr.ln{border-bottom:4px solid var(--ink);padding-bottom:4px}
.vcol .in{width:100%;max-width:none;margin:6px 0 0;font-size:28px;text-align:right}
.big{font-size:44px;line-height:1.3;margin:0 0 6px}
.stars{font-size:34px;letter-spacing:4px}
.res{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
@media(prefers-reduced-motion:no-preference){.shake{animation:sh .3s}}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.grid{display:grid;gap:6px;justify-content:center;direction:ltr}
.grid i{width:22px;height:22px;border-radius:50%;background:#E32323}
.grid.gr i{background:#18A957}
.rowv{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;direction:ltr}
.box{border:3px solid var(--line);background:var(--card);border-radius:8px;padding:8px;display:flex;gap:6px}
.box i{width:22px;height:22px;border-radius:50%;background:#7B3FA0}
.box.b2 i{background:#1C7FC4}.box.b3 i{background:#7FA32A}
.dr{display:flex;align-items:center;justify-content:center;gap:8px;direction:ltr;margin:14px 0;flex-wrap:nowrap}
.dr .eq{white-space:nowrap;text-align:left}
select.in.sm{min-width:4.4em}
</style>
</head>
<body>
<div class="wrap">
  <div id="bar"></div>
  <div id="app" class="card"></div>
</div>
<script>
const E=s=>`<bdi class="n">${s}</bdi>`;
const tbl=(h,rows)=>`<table class="t"><tr><th colspan="2">${h}</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
const grid=(r,c,cl='')=>`<div class="grid ${cl}" style="grid-template-columns:repeat(${c},22px)">${'<i></i>'.repeat(r*c)}</div>`;
const candles=()=>`<div class="rowv">${[1,2,3].map(k=>`<div class="box b${k}"><i></i><i></i><i></i></div>`).join('')}</div>`;
const BR=`<svg width="22" height="106" viewBox="0 0 22 106" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M3 2Q12 2 12 14V40Q12 53 20 53Q12 53 12 66V92Q12 104 3 104"/></svg>`;
const DR=i=>`<div class="dr">${grid(4,5,'gr')}${BR}<div class="eq">4 × 5 = {${i}}</div></div>`;
const VC=(a,b,i)=>`<div class="vcol" style="min-width:110px;margin:6px 18px"><div class="vr"><b></b><span>${a}</span></div><div class="vr ln"><b>×</b><span>${b}</span></div>{${i}}</div>`;
const CMP=[[1,'<'],[3,'='],[2,'>']];
const OP=[[1,'+'],[2,'−'],[3,'×'],[4,'÷']];
const price=()=>tbl('إيجار',[['الزورق لساعة واحدة',E('4 $')],['سترة نجاة',E('2 $')]]);

const S=[
{n:'اختر الإجابة الصحيحة',ic:'🎯',qs:[
 {t:'mc',q:`ما جملة الضرب التي تعبر عن جملة الجمع ${E('6 + 6 + 6 + 6 + 6 + 6')}؟`,o:[E('4 × 6'),E('5 × 6'),E('6 × 6')],a:2,w:`العدد 6 تكرر ست مرات، فالجملة ${E('6 × 6')}.`},
 {t:'mc',q:'ما زوج الجمل العددية التي تمثل خاصية الإبدال في الضرب؟',o:[`${E('3 × 4 = 12')} و ${E('4 × 3 = 12')}`,`${E('3 × 4 = 12')} و ${E('3 × 8 = 24')}`,`${E('3 × 4 = 12')} و ${E('3 + 3 + 3 + 3 = 12')}`],a:0,w:'خاصية الإبدال: تغيير ترتيب العاملين لا يغيّر الناتج.'},
 {t:'mc',q:'ما ناتج ضرب 5 في 2؟',o:[E(7),E(10),E(12)],a:1,w:`${E('5 × 2 = 10')}`},
 {t:'mc',q:'لدى حمد 4 أوراق نقدية من فئة 10 ريال قطري. ما عدد الريالات مع حمد؟',o:[`${E(14)} ريال قطري`,`${E(40)} ريال قطري`,`${E(400)} ريال قطري`],a:1,w:`${E('4 × 10 = 40')}`},
 {t:'mc',q:`ما العدد الناقص في الجملة العددية أدناه مستعملاً خاصية التوزيع؟ ${E('8 × 5 = (5 × 5) + ( … × 5)')}`,o:[E(3),E(4),E(5)],a:0,w:`${E('8 = 5 + 3')} إذن ${E('8 × 5 = (5 × 5) + (3 × 5)')}`},
 {t:'mc',q:`إذا كان سعر قطعة حلوى ${E('7 QR')} كم ريالاً قطرياً يدفع خالد لشراء 6 قطع من الحلوى؟ ما الجملة العددية التي تمثل حل المسألة؟`,o:[E('6 × 7 = QR 13'),E('6 × 7 = QR 35'),E('6 × 7 = QR 42')],a:2,w:`${E('6 × 7 = 42')}`}
]},
{n:'الجمع والضرب بالشبكات',ic:'🔴',qs:[
 {t:'fill',q:'اكتب جملة جمع للشبكة أدناه',v:()=>grid(3,3),f:`<div class="eq">{0} + {1} + {2} = {3}</div>`,o:[[3,4,6,9],[3,4,6,9],[3,4,6,9],[6,9,12,33]],a:[3,3,3,9],w:`ثلاثة صفوف في كل صف 3: ${E('3 + 3 + 3 = 9')}`},
 {t:'fill',q:'اكتب جملة ضرب للشبكة أدناه',v:()=>grid(2,4),f:`<div class="eq">{0} × {1} = {2}</div>`,o:[[2,4,6,8],[2,4,6,8],[6,8,12,24]],a:[2,4,8],w:`صفان في كل صف 4: ${E('2 × 4 = 8')}`}
]},
{n:'القسمة',ic:'🎾',qs:[
 {t:'fill',q:'وزع صالح 15 كرة تنس على 3 علب بالتساوي. أوجد عدد الكرات في كل علبة.',f:`<div class="eq">15 {0} {1} = {2}</div>`,o:[OP,[3,4,6,30],[3,5,10,12]],a:[4,3,5],w:`${E('15 ÷ 3 = 5')} كرات في كل علبة.`},
 {t:'fill',q:'أكمل جملة القسمة:',f:`<div class="eq">9 ÷ 3 = {0}</div>`,o:[[3,6,12,27]],a:[3],w:`${E('9 ÷ 3 = 3')} لأن ${E('3 × 3 = 9')}`}
]},
{n:'مسائل الضرب',ic:'🍫',qs:[
 {t:'fill',q:'اشترى عمر 9 علب من الشكولاتة، إذا كانت العلبة تحوي 4 ألواح، فكم لوحاً لدى عمر؟',f:`<div class="eq">{0} {1} {2} {3} {4}</div>`,o:[[3,4,5,6],OP,[8,9,10,12],CMP,[13,32,36,94]],a:[4,3,9,3,36],w:`${E('4 × 9 = 36')} لوحاً.`},
 {t:'fill',q:'أجد العامل الناقص في الجملة العددية أدناه.',f:`<div class="eq">{0} × 9 = 54</div>`,o:[[5,6,7,45]],a:[6],w:`${E('6 × 9 = 54')}`}
]},
{n:'حقائق الضرب والمقارنة',ic:'⚖️',qs:[
 {t:'fill',q:'أجد ناتج الضرب.',f:`<div class="eq">0 × 4 = {0}</div><div class="rowv">${VC(6,1,1)}${VC(1,1,2)}</div>`,o:[[0,1,4,40],[1,6,7,61],[0,1,2,11]],a:[0,6,1],w:`${E('0 × 4 = 0')}، ${E('6 × 1 = 6')}، ${E('1 × 1 = 1')}. أي عدد × 0 = 0، وأي عدد × 1 = العدد نفسه.`},
 {t:'fill',q:'اكتب < أو > أو = للمقارنة.',f:`<div class="eq">0 × 0 {0} 0 × 9</div><div class="eq">0 × 8 {1} 5 × 1</div><div class="eq">1 × 7 {2} 1 × 3</div>`,o:[CMP,CMP,CMP],a:[3,1,2],w:`${E('0 = 0')}، ${E('0 < 5')}، ${E('7 > 3')}`}
]},
{n:'الشموع والمضاعفة',ic:'🕯️',qs:[
 {t:'fill',q:'رتب جاسم مجموعة من الشموع في 3 صناديق، ووضع في كل صندوق 3 شمعات. ما عدد الشموع التي رتبها جاسم؟',v:candles,f:`<div class="eq">{0} {1} {2} = {3}</div>`,o:[[2,3,4,6],OP,[2,3,4,6],[6,9,12,33]],a:[3,3,3,9],w:`${E('3 × 3 = 9')} شموع.`},
 {t:'fill',q:'أوجد ناتج الضرب.',f:`<div class="rowv">${VC(7,3,0)}${VC(3,2,1)}</div>`,o:[[10,21,24,37],[5,6,7,32]],a:[21,6],w:`${E('7 × 3 = 21')} و ${E('3 × 2 = 6')}`},
 {t:'fill',q:'أضاعف ناتج إحدى حقائق الضرب للعدد 4 لإيجاد ناتج الضرب أدناه.',f:`<div class="eq">8 × 5 = ?</div>${DR(0)}${DR(1)}<div class="eq" style="margin-top:18px">8 × 5 = {2} <span dir="rtl" style="font-size:19px;font-weight:700;margin-inline-start:14px">إذن</span></div>`,o:[[9,15,20,25],[9,15,20,25],[13,35,40,45]],a:[20,20,40],w:`${E('4 × 5 = 20')} مرتان، و ${E('20 + 20 = 40')} إذن ${E('8 × 5 = 40')}`}
]},
{n:'رحلة أحمد',ic:'🚤',qs:[
 {t:'fill',q:'زار أحمد أحد البلدان، واستأجر زورقاً وسترة نجاة لمدة 5 ساعات، ما المبلغ الذي أنفقه أحمد؟',v:price,f:`<div class="eq">4 × 5 = {0} $</div><div class="eq">2 × 5 = {1} $</div><div class="eq">{2} $ = 20 + 10</div>`,o:[[9,10,20,45],[7,10,20,25],[26,30,35,40]],a:[20,10,30],w:`${E('4 × 5 = 20')} للزورق، ${E('2 × 5 = 10')} للسترة، والمجموع ${E('20 + 10 = 30')} $. (تُراعى الحلول الأخرى)`},
 {t:'fill',q:'استخدم خاصية التجميع لإيجاد ناتج الضرب.',f:`<div class="eq">5 × 1 × 2 = {0}</div>`,o:[[8,10,11,52]],a:[10],w:`${E('1 × 2 = 2')} ثم ${E('5 × 2 = 10')}`}
]}
];
const $=s=>document.querySelector(s);
const app=$('#app'),bar=$('#bar');
const total=S.reduce((a,s)=>a+s.qs.length*2,0);
let si=0,qi=0,tries=0,done=false,res=S.map(()=>0),sel=new Set();
const sum=()=>res.reduce((a,b)=>a+b,0);
const num=v=>{v=v.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s,٬]/g,'');return /^\d+$/.test(v)?+v:NaN};

function head(){
  bar.innerHTML=S.map((s,i)=>`<span class="dot ${i<si?'ok':i===si?'cur':''}" title="${s.n}">${s.ic}</span>`).join('')+`<b class="score">⭐ ${E(sum())}</b>`;
}
function intro(){
  head();const s=S[si];
  app.innerHTML=`<div class="meta"><span>المرحلة ${E(si+1)} من ${E(S.length)}</span></div>
  <h2 class="big">${s.ic} ${s.n}</h2>
  <p>${si===0?'اجمع أكبر عدد من النجوم! نجمتان لكل إجابة صحيحة من المحاولة الأولى، ونجمة واحدة من المحاولة الثانية.':''} في هذه المرحلة ${E(s.qs.length)} أسئلة.</p>
  <div class="row"><button class="btn" id="go">ابدأ</button></div>`;
  $('#go').onclick=ask;
}
function ask(){
  tries=0;done=false;sel=new Set();head();
  const s=S[si],q=s.qs[qi];
  let h=`<div class="meta"><span>${s.ic} ${s.n}</span><span>السؤال ${E(qi+1)} من ${E(s.qs.length)}</span></div><div class="q">${q.q}</div>`;
  if(q.v)h+=`<div class="vis">${q.v()}</div>`;
  if(q.t==='mc'||q.t==='multi')h+=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><b class="L">${q.t==='multi'?'✓':'ABCD'[i]}</b><span>${o}</span></button>`).join('')}</div>`;
  if(q.t==='fill')h+=`<div class="fill">${q.f.replace(/\{(\d+)\}/g,(m,i)=>`<select class="in${q.o[i].every(x=>String(Array.isArray(x)?x[1]:x).length<=3)?' sm':''}" dir="ltr" data-i="${i}" aria-label="اختر الإجابة"><option value="">اختر</option>${(()=>{const r=[...q.o[i]];if(!r.some(Array.isArray))r.sort((x,y)=>x-y);return r.map(x=>Array.isArray(x)?`<option value="${x[0]}">${x[1]}</option>`:`<option value="${x}">${String(x).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}</option>`).join('')})()}</select>`)}</div>`;
  h+=`<div id="fb" class="fb" aria-live="polite"></div><div class="row"><button class="btn" id="chk" ${q.t==='mc'?'hidden':''}>تحقق</button><button class="btn alt" id="nx" hidden>${qi===s.qs.length-1?(si===S.length-1?'النتيجة':'إنهاء المرحلة'):'التالي'}</button></div>`;
  app.innerHTML=h;
  $('#nx').onclick=next;
  const opts=[...app.querySelectorAll('.opt')];
  if(q.t==='mc')opts.forEach(b=>b.onclick=()=>{
    if(done)return;const i=+b.dataset.i;
    if(i===q.a){b.classList.add('good');finish(tries===0?2:1)}
    else{tries++;b.classList.add('bad','shake');b.disabled=true;
      if(tries>=2){opts[q.a].classList.add('good');finish(0)}else fb('ليست هذه الإجابة، جرّب مرة أخرى 💪',false)}
  });
  if(q.t==='multi'){
    opts.forEach(b=>b.onclick=()=>{if(done)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')});
    $('#chk').onclick=()=>{
      if(done)return;
      const ok=sel.size===q.c.length&&q.c.every(i=>sel.has(i));
      if(ok){opts.forEach((b,i)=>b.classList.toggle('good',q.c.includes(i)));finish(tries===0?2:1)}
      else{tries++;if(tries>=2){opts.forEach((b,i)=>{b.classList.remove('sel');b.classList.toggle('good',q.c.includes(i))});finish(0)}else fb('اختر مرة أخرى؛ قد تكون هناك أكثر من قيمة صحيحة 💪',false)}
    };
  }
  if(q.t==='fill'){
    const ins=[...app.querySelectorAll('.in')];ins[0].focus();
    const go=()=>{
      if(done)return;
      let all=true;
      ins.forEach((x,i)=>{const v=num(x.value),a=q.a[i];const ok=typeof a==='function'?a(v):v===a;
        x.classList.toggle('good',ok);x.classList.toggle('bad',!ok);if(!ok)all=false});
      if(all){finish(tries===0?2:1)}
      else{tries++;
        if(tries>=2){ins.forEach((x,i)=>{const a=q.a[i];x.value=typeof a==='function'?q.ex:a;x.classList.remove('bad');x.classList.add('good')});finish(0)}
        else{app.querySelector('.fill').classList.add('shake');fb('بعض الإجابات تحتاج مراجعة، جرّب مرة أخرى 💪',false)}}
    };
    $('#chk').onclick=go;ins.forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  }
}
function fb(t,g){const f=$('#fb');f.className='fb '+(g?'g':'b');f.textContent=t}
function finish(p){
  done=true;res[si]+=p;head();
  const q=S[si].qs[qi],f=$('#fb');
  f.className='fb '+(p?'g':'b');
  f.innerHTML=(p===2?'ممتاز! ⭐⭐':p===1?'أحسنت! ⭐':'الإجابة الصحيحة ظاهرة أمامك، ركّز في الشرح:')+`<div class="why">${q.w}</div>`;
  app.querySelectorAll('.in').forEach(x=>x.disabled=true);
  app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  $('#chk').hidden=true;$('#nx').hidden=false;$('#nx').focus();
}
function next(){
  qi++;
  if(qi>=S[si].qs.length){si++;qi=0;if(si>=S.length)return end();return intro()}
  ask();
}
function end(){
  si=S.length;head();
  const p=Math.round(sum()/total*100);
  const st=p>=85?3:p>=60?2:1;
  const weak=S.filter((s,i)=>res[i]<s.qs.length*2*0.6);
  app.innerHTML=`<h2 class="big">🏆 أنهيت الرحلة!</h2>
  <div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
  <p>جمعت ${E(sum())} من ${E(total)} نجمة (${E(p+'%')})</p>
  ${S.map((s,i)=>`<div class="res"><span>${s.ic} ${s.n}</span><span>${E(res[i]+' / '+s.qs.length*2)}</span></div>`).join('')}
  <p>${weak.length?'تدرّب أكثر على: '+weak.map(s=>s.n).join('، ')+'.':'أداء رائع في جميع المراحل!'}</p>
  <div class="row"><button class="btn" id="again">العب مرة أخرى</button></div>`;
  $('#again').onclick=()=>{si=0;qi=0;res=S.map(()=>0);intro()};
}
intro();
</script>
</body>
</html>
